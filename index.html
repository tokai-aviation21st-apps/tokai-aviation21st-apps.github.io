<style>
:root{--bg:#f2f1f4;--surface:#fff;--line:#dcd9e1;--fg:#1d2233;--fg2:#4a5063;--fg3:#7a7f8f;--accent:#7b3a64;--accent-fg:#fff;--ng:#a33a3a;
 --sans:system-ui,-apple-system,"Hiragino Sans",sans-serif;--mono:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14151b;--surface:#1d1f27;--line:#2f323d;--fg:#e7e6ee;--fg2:#b5b6c3;--fg3:#858899;--accent:#d39ac0;--accent-fg:#1d1220;--ng:#ef9a9a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14151b;--surface:#1d1f27;--line:#2f323d;--fg:#e7e6ee;--fg2:#b5b6c3;--fg3:#858899;--accent:#d39ac0;--accent-fg:#1d1220;--ng:#ef9a9a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);display:grid;place-items:center;padding-inline:16px}
main{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent);margin:0 0 6px}
h1{font-size:20px;margin:0 0 8px}
p{color:var(--fg2);font-size:14px;line-height:1.7;margin:0 0 18px}
label{font-size:13px;color:var(--fg3);display:block;margin-bottom:6px}
input{width:100%;font:15px var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:14px;width:100%;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-fg);font:600 15px var(--sans);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;margin:10px 0 0;font-size:13px;color:var(--ng)}
small{display:block;margin-top:16px;font-size:12px;color:var(--fg3);line-height:1.6}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--fg2);line-height:1.5;cursor:pointer}
.chk input{width:auto;margin:2px 0 0;accent-color:var(--accent)}
.note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

 <h1>学習アプリ</h1>
 <p>このページはパスワードで保護されています。共有されたパスワードを入力してください。</p>
 <form id="f"><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
 <label class="chk"><input id="rem" type="checkbox"><span>この端末に記憶する（90日間）</span></label>
 <button id="go" type="submit">開く</button><div id="msg" role="status"></div></form>
 <small>自分の端末ならチェックを入れると、次から入力を省けます。共用のパソコンやほかの人の端末ではチェックを入れないでください（タブを閉じると消えます）。記憶した場合は、トップページの「ログアウト」で消せます。</small>
 <small class="note">学生が個人で作った非公式の学習用アプリです。内容の正確性は保証しません。試験や訓練では、必ず教科書・授業資料で確認してください。<br><span id="upd"></span></small>

const LEGACY='apps-gate-v1',SIDK='apps-gate-sid',SKK='apps-gate-sk',DAYS=90,SESSION_H=12;
const $=id=>document.getElementById(id);
const gate=$('gate'),msg=$('msg'),btn=$('go'),pw=$('pw');
/* opened inside another site's frame: show nothing of the site, only a link to open it directly (clickjacking) */
let framed=true;try{framed=window.top!==window.self}catch(e){}
if(framed){$('f').remove();const p=document.createElement('p'),a=document.createElement('a');p.className='framed';
  p.textContent='このページは、ほかのサイトの中では開けません。';a.href=location.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='直接開く';
  p.append(document.createElement('br'),a);gate.insertBefore(p,gate.querySelector('small'));gate.hidden=false;return}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const M={
  browser:'このブラウザでは開けません。https のページで、最新の Chrome・Safari・Edge などを使ってください。',
  broken:'ページのデータが壊れているか、読み込みが途中で止まりました。再読み込みしてください。直らない場合は作成者に知らせてください。',
  wrong:'パスワードが違います。',
  derive:'このブラウザではパスワードを確認できませんでした。別のブラウザで試してください。',
  changed:'パスワードが変更されました。新しいパスワードを入力してください。',
  expired:'前回の入力から90日たったため、もう一度入力してください。',
  stale:'記憶していた情報では開けませんでした。もう一度入力してください。',
  render:'中身の表示に失敗しました。再読み込みしてください。'
};
function show(m){gate.hidden=false;msg.textContent=m||'';pw.focus()}

/* Remembered ("この端末に記憶する"): the site key is kept as a non-extractable CryptoKey in IndexedDB
   (record 'key'). Pages can use it to decrypt, but no script can read its bytes out.
   Not remembered: the key is split in two so that closing the tab makes it unusable.
   IndexedDB holds only a random non-extractable wrapping key (record 'w:<sid>'); the site key, encrypted
   with it, lives in this tab's sessionStorage (SKK). When the tab closes, sessionStorage is gone and the
   wrapping key alone opens nothing. */
const KDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('apps-gate',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();try{return await new Promise((res,rej)=>{const t=db.transaction('k',mode);const q=fn(t.objectStore('k'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}finally{db.close()}},
  get(id){return this.run('readonly',s=>s.get(id))},
  put(id,v){return this.run('readwrite',s=>s.put(v,id))},
  del(id){return this.run('readwrite',s=>s.delete(id)).catch(()=>{})},
  ids(){return this.run('readonly',s=>s.getAllKeys())}
};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const ssDel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
function dropLegacy(){for(const S of ['localStorage','sessionStorage'])try{window[S].removeItem(LEGACY)}catch(e){}}
async function dropSession(){const v=readSK();ssDel(SKK);ssDel(SIDK);if(v&&v.sid)await KDB.del('w:'+v.sid)}
function readSK(){try{const v=JSON.parse(ssGet(SKK)||'null');return v&&v.sid&&v.i&&v.c?v:null}catch(e){return null}}
const importKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
async function saveRemembered(key){await dropSession();await KDB.put('key',{key,s:P.s,exp:Date.now()+DAYS*864e5})}
/* raw: the site key bytes (ArrayBuffer), wiped by the caller after use */
async function saveSession(raw){
  await dropSession();
  const w=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const sid=enc(crypto.getRandomValues(new Uint8Array(12))),i=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv:i},w,raw);
  await KDB.put('w:'+sid,{w,s:P.s,exp:Date.now()+SESSION_H*36e5});
  ssSet(SKK,JSON.stringify({sid,i:enc(i),c:enc(c)}));
}
/* returns the site key for this tab's session, or null */
async function loadSession(){
  const v=readSK();if(!v)return null;
  const rec=await KDB.get('w:'+v.sid);
  if(!rec||!rec.w){ssDel(SKK);return null}
  if(rec.s!==P.s){await dropSession();throw 'changed'}
  if(rec.exp<Date.now()){await dropSession();return null}
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.i)},rec.w,b64(v.c)));
  try{return await importKey(raw)}finally{raw.fill(0)}
}
/* session wrapping keys whose time is up (their tabs are long closed) and records left by older versions */
async function sweep(){
  const now=Date.now();
  for(const id of (await KDB.ids())||[]){
    const r=await KDB.get(id);
    if(id==='key'){if(r&&r.sid)await KDB.del(id)}            /* old version kept tab-only keys here, usable after the tab closed */
    else if(String(id).startsWith('w:')){if(!r||!(r.exp>now))await KDB.del(id)}
  }
  ssDel(SIDK);
}

if(!window.crypto||!crypto.subtle){show(M.browser);btn.disabled=true;return}
let iv,ct,salt;
try{iv=b64(P.i);ct=b64(P.c);salt=b64(P.s);
  if(P.h&&enc(await crypto.subtle.digest('SHA-256',ct))!==P.h)throw 0;
}catch(e){show(M.broken);btn.disabled=true;return}
async function render(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  /* wait until this gate page has finished parsing; otherwise document.open() is ignored and the app gets written into the gate page */
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  try{const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();if(P.h)document.documentElement.setAttribute('data-site-ver',P.h)}
  catch(e){throw {render:1}}
}
$('f').addEventListener('submit',async e=>{
  e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='確認中…';
  const done=m=>{btn.disabled=false;btn.textContent='開く';msg.textContent=m};
  const remember=$('rem').checked;
  let key,raw=null;
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value.trim()),'PBKDF2',false,['deriveKey','deriveBits']);
    if(remember){
      key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:P.n},base,{name:'AES-GCM',length:256},false,['decrypt']);
    }else{
      /* the bytes are needed once to store the tab-only copy; the key used from here on is non-extractable */
      raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:P.n},base,256));
      key=await importKey(raw);
    }
  }catch(err){if(raw)raw.fill(0);return done(M.derive)}
  try{await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(err){if(raw)raw.fill(0);return done(M.wrong)}
  dropLegacy();
  try{if(remember)await saveRemembered(key);else await saveSession(raw)}catch(err){/* IndexedDB unavailable: open this page only */}
  finally{if(raw)raw.fill(0)}
  try{await render(key)}catch(err){done(M.render)}
});

/* move a key remembered by the old version (raw bytes in Web Storage) into IndexedDB, then delete the raw copy */
async function migrate(){
  for(const [S,remember] of [['localStorage',true],['sessionStorage',false]]){
    let v=null;try{v=JSON.parse(window[S].getItem(LEGACY)||'null')}catch(e){}
    if(!v||!v.k)continue;
    if(v.s!==P.s){dropLegacy();return}
    const raw=b64(v.k);
    try{
      if(remember)await KDB.put('key',{key:await importKey(raw),s:v.s,exp:v.exp||Date.now()+DAYS*864e5});
      else await saveSession(raw);
      dropLegacy();return;
    }catch(e){return}  /* IndexedDB unavailable: keep the old copy so the person is not locked out */
    finally{raw.fill(0)}
  }
}
let rec=null,legacyKey=null,idbOK=true;
try{await sweep();await migrate();rec=await KDB.get('key')}catch(e){
  idbOK=false;
  try{const v=JSON.parse(localStorage.getItem(LEGACY)||sessionStorage.getItem(LEGACY)||'null');if(v&&v.k&&!(v.exp&&v.exp<Date.now()))legacyKey=v}catch(_){}
}
if(rec){
  if(rec.s!==P.s){await KDB.del('key');show(M.changed);return}
  if(rec.exp<Date.now()){await KDB.del('key');show(M.expired);return}
  try{await render(rec.key);return}
  catch(e){if(e&&e.render){show(M.render);return}await KDB.del('key');show(M.stale);return}
}
if(idbOK){
  let key=null;
  try{key=await loadSession()}catch(e){if(e==='changed'){show(M.changed);return}await dropSession();show(M.stale);return}
  if(key){try{await render(key);return}catch(e){if(e&&e.render){show(M.render);return}await dropSession();show(M.stale);return}}
}
if(legacyKey&&legacyKey.s===P.s){
  try{const key=await crypto.subtle.importKey('raw',b64(legacyKey.k),'AES-GCM',false,['decrypt']);await render(key);return}catch(e){}
}
show('');
})();
